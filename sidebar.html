<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 12px; background: #0f0f0f; color: #fff; }
    header { border-bottom: 1px solid #272727; padding-bottom: 10px; margin-bottom: 10px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: #aaa; }
    
    select {
      background: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      padding: 2px 4px;
    }

    #drop-zone { border: 2px dashed #3f3f3f; padding: 10px; text-align: center; border-radius: 8px; margin: 10px 0; background: #1f1f1f; font-size: 12px; color: #aaa; }
    #drop-zone.dragover { border-color: #ff0000; color: #fff; background: #2a2a2a; }
    
    ul { list-style: none; padding: 0; margin: 0; }
    
    li { 
      background: #181818; 
      border: 1px solid #272727; 
      margin-bottom: 8px; 
      padding: 8px; 
      border-radius: 6px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      cursor: grab; 
      transition: background 0.15s ease;
    }
    li:hover { background: #222; }
    
    .thumb-img {
      width: 72px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #000;
      cursor: pointer;
    }

    .info-container {
      flex-grow: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .title { 
      font-size: 12px; 
      font-weight: 500; 
      cursor: pointer; 
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      color: #eee;
    }
    .title:hover { color: #ff4444; }

    .remove-btn { 
      background: none; 
      border: none; 
      color: #777; 
      font-size: 14px; 
      cursor: pointer; 
      padding: 4px;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: #ff4444; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h3 style="margin: 0; font-size: 15px;">YouTube Queue</h3>
      <label style="font-size: 12px; cursor: pointer;">
        <input type="checkbox" id="autoplay-toggle"> Autoplay
      </label>
    </div>
    <div class="header-controls">
      <span>Sync Mode:</span>
      <select id="storage-mode">
        <option value="local">Local Only</option>
        <option value="sync">Firefox Account Sync</option>
      </select>
    </div>
  </header>

  <div id="drop-zone">Drop YouTube Links Here</div>
  <ul id="queue-list"></ul>

  <script src="sidebar.js"></script>
</body>
</html>
