<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #1f1f1f;
      color: #ffffff;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title-area h2 {
      margin: 0;
      font-size: 16px;
    }
    .info-icon {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #383838;
      color: #aaa;
      font-size: 11px;
      font-weight: bold;
      position: relative;
    }
    .info-icon:hover::after {
      content: "Shortcuts:\n• Alt + Click thumbnail to add\n• Alt + Q on link/tab to add";
      position: absolute;
      top: 22px;
      left: 0;
      background: #333;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      white-space: pre;
      width: 180px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 100;
    }
    .counter-badge {
      font-size: 12px;
      background: #333;
      padding: 2px 6px;
      border-radius: 10px;
      color: #aaa;
    }
    .controls-grid {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-play { background: #cc0000; color: white; }
    .btn-play:hover { background: #ff0000; }
    .btn-clear { background: #383838; color: #ff5555; }
    .btn-clear:hover { background: #484848; }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #ccc;
    }
    select {
      background: #2b2b2b;
      color: white;
      border: 1px solid #444;
      padding: 4px;
      border-radius: 4px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin: 12px 0 6px 0;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      background: #2b2b2b;
      margin-bottom: 6px;
      padding: 6px;
      border-radius: 4px;
      gap: 8px;
      border: 1px solid transparent;
    }
    li.playing {
      border-color: #ff0000;
      background: #362020;
    }
    li.played-item {
      opacity: 0.6;
    }
    .thumb-img {
      width: 48px;
      height: 36px;
      object-fit: cover;
      border-radius: 3px;
      cursor: pointer;
    }
    .info-container { flex: 1; overflow: hidden; }
    .title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .remove-btn {
      background: transparent;
      color: #888;
      font-size: 12px;
      padding: 4px;
      flex: initial;
    }
    .remove-btn:hover { color: white; }
    #drop-zone {
      border: 2px dashed #444;
      border-radius: 4px;
      padding: 10px;
      text-align: center;
      color: #888;
      margin-top: 10px;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-area">
      <h2>Queue</h2>
      <div class="info-icon">i</div>
    </div>
    <span id="queue-counter" class="counter-badge">0/0</span>
  </div>

  <div class="controls-grid">
    <div class="btn-row">
      <button id="play-btn" class="btn-play">▶ Play Queue</button>
      <button id="clear-btn" class="btn-clear">Clear</button>
    </div>

    <div class="setting-row">
      <label for="after-play-mode">After video plays:</label>
      <select id="after-play-mode">
        <option value="remove">Remove from queue</option>
        <option value="keep">Keep in queue</option>
      </select>
    </div>

    <div class="setting-row">
      <label for="storage-mode">Sync mode:</label>
      <select id="storage-mode">
        <option value="local">This Computer</option>
        <option value="sync">Firefox Account</option>
      </select>
    </div>
  </div>

  <div id="drop-zone">Drop YouTube Links Here</div>

  <div id="active-section">
    <div class="section-title">Up Next</div>
    <ul id="queue-list"></ul>
  </div>

  <div id="played-section" style="display: none;">
    <div class="section-title">Played Videos</div>
    <ul id="played-list"></ul>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
