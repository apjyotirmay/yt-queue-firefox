<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="content.css">
  </head>
  <body>
    <div class="sticky-header solid-bg">
      <div class="header">
        <div class="title-area">
          <h2>Queue</h2>
          <div class="info-icon">i</div>
        </div>
        <span id="queue-counter" class="counter-badge">0/0</span>
      </div>

      <div class="btn-row grid">
        <div class="row">
          <button id="play-pause-btn" class="btn-play grow">▶ Play</button>
          <button id="next-btn" class="btn-next grow">⏭ Skip</button>
        </div>
        <div class="row">
          <button id="clear-btn" class="btn-clear auto">Clear</button>
          <button id="settings-btn" class="btn-settings min"><!-- Example Lucide Gear SVG (100% vector, monochrome) -->
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="controls-grid">
      <div class="setting-row">
        <label for="autoplay-toggle">
          <input type="checkbox" id="autoplay-toggle" checked />
          <span>Autoplay next video</span>
        </label>
      </div>

      <div class="setting-row">
        <label for="keep-played-toggle">
          <input type="checkbox" id="keep-played-toggle" />
          <span>Keep played videos</span>
        </label>
      </div>
    </div>

    <div class="sync-status-container">
      <div id="sync-indicator" class="sync-indicator" title="Storage Status">
        <span class="status-dot"></span>
        <span id="sync-status-text" class="status-text">Local Mode</span>
      </div>
      <span id="sync-time-text" class="sync-time"></span>
    </div>

    <div id="played-section" style="display: none">
      <div id="clear-played-btn-wrapper">
        <button id="clear-played-btn" class="text-btn" title="Clear played history">Clear Played</button>
      </div>

      <!-- Clickable Foldable Header -->
      <div class="section-title foldable-header mt-0" id="played-toggle-header">
        <span id="played-arrow">▸</span> Played Videos (<span id="played-count"
          >0</span
        >)
      </div>

      <!-- Collapsible List Wrapper -->
      <div id="played-list-container" class="collapsed">
        <ul id="played-list"></ul>
      </div>
    </div>

    <div id="active-section">
      <div class="section-title">Up Next</div>
      <ul id="queue-list"></ul>
    </div>

    <script src="sidebar.js"></script>
  </body>
</html>
